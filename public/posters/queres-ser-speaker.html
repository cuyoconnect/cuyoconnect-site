<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CuyoConnect — ¿Querés ser speaker?</title>
    <style>
      @font-face {
        font-family: Bebas;
        src: url("./fonts/bebas-neue-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        unicode-range: U+0000-00FF;
      }
      @font-face {
        font-family: Bebas;
        src: url("./fonts/bebas-neue-latin-ext-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        unicode-range: U+0100-024F, U+00C9, U+00E9;
      }
      @font-face {
        font-family: Sora;
        src: url("./fonts/sora-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        unicode-range: U+0000-00FF;
      }
      @font-face {
        font-family: Sora;
        src: url("./fonts/sora-latin-ext-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        unicode-range: U+0100-024F;
      }
      @font-face {
        font-family: Sora;
        src: url("./fonts/sora-latin-600-normal.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
        unicode-range: U+0000-00FF;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
        background: #111;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 1.25rem;
      }

      .poster {
        position: relative;
        width: min(1080px, 100%);
        aspect-ratio: 1080 / 1920;
        background: #f6f2e6;
        color: #1d1d1f;
        overflow: hidden;
        border-radius: 2.5rem;
      }

      .logo {
        position: absolute;
        top: 4.4%;
        right: 6%;
        width: 19.5%;
        height: auto;
      }

      .title {
        position: absolute;
        top: 4.1%;
        left: 6%;
        right: 4%;
        font-family: Bebas, sans-serif;
        font-weight: 400;
        font-size: clamp(3.5rem, 19.8vw, 13.4rem);
        line-height: 0.78;
        letter-spacing: 0.01em;
        text-transform: uppercase;
      }

      .speaker {
        display: inline-block;
        background: #1d1d1f;
        color: #ffec6b;
        line-height: 0.82;
        padding: 0.02em 0.1em 0.03em;
        margin: 0.02em 0 0 -0.04em;
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
      }

      .body {
        position: absolute;
        top: 38%;
        left: 6.7%;
        width: 72%;
        font-family: Sora, sans-serif;
        font-weight: 400;
        font-size: clamp(0.95rem, 3.3vw, 2.25rem);
        line-height: 1.42;
        color: #1d1d1f;
      }

      .stain {
        position: absolute;
        right: -4%;
        bottom: 2%;
        width: 85%;
        height: 41%;
        pointer-events: none;
      }

      .cta-wrap {
        position: absolute;
        left: 6.7%;
        bottom: 4.6%;
        z-index: 2;
      }

      .cta {
        font-family: Bebas, sans-serif;
        font-size: clamp(2rem, 8vw, 5.4rem);
        line-height: 0.9;
        letter-spacing: 0.02em;
      }

      .url {
        margin-top: 0.55em;
        font-family: Sora, sans-serif;
        font-weight: 600;
        font-size: clamp(0.7rem, 2vw, 1.375rem);
        color: #1d1d1f;
      }
    </style>
  </head>
  <body>
    <article class="poster">
      <img class="logo" src="../logo.png" alt="" />
      <h1 class="title">
        QUERÉS<br />
        SER<br />
        <span class="speaker">SPEAKER</span>
      </h1>
      <p class="body">
        En CuyoConnect compartimos lo que estamos aprendiendo y construyendo. Si tenés un proyecto, una experiencia o algo que aprendiste, queremos que lo cuentes.
      </p>
      <svg class="stain" viewBox="0 0 920 780" aria-hidden="true">
        <defs>
          <filter id="water" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="3" seed="7" result="n" />
            <feDisplacementMap in="SourceGraphic" in2="n" scale="48" xChannelSelector="R" yChannelSelector="G" />
            <feGaussianBlur stdDeviation="18" />
          </filter>
          <radialGradient id="sunblob" cx="58%" cy="62%" r="58%">
            <stop offset="0%" stop-color="#ffec6b" stop-opacity="1" />
            <stop offset="38%" stop-color="#ffec6b" stop-opacity="0.88" />
            <stop offset="70%" stop-color="#ffec6b" stop-opacity="0.32" />
            <stop offset="100%" stop-color="#ffec6b" stop-opacity="0" />
          </radialGradient>
        </defs>
        <ellipse cx="560" cy="500" rx="420" ry="320" fill="url(#sunblob)" filter="url(#water)" />
        <ellipse cx="430" cy="560" rx="240" ry="180" fill="#ffec6b" opacity="0.62" filter="url(#water)" />
      </svg>
      <div class="cta-wrap">
        <p class="cta">¡SUMATE!</p>
        <p class="url">cuyoconnect.com/speakers</p>
      </div>
    </article>
  </body>
</html>
